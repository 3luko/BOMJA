<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ event["alt"] }} | BOMJA Gallery</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bomja-style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <a class="brand" href="{{ url_for('home') }}">
                <img src="{{ url_for('static', filename='visuals/logos/unnamed (2).png') }}" alt="BOMJA logo">
                BOMJA
            </a>
            <a class="btn secondary" href="{{ url_for('home') }}#gallery">Back to Gallery</a>
        </nav>
    </header>

    <main>
        <section class="event-gallery-page" id="gallery">
            <a class="gallery-back-link" href="{{ url_for('home') }}#gallery">&larr; All past events</a>
            <h1 class="section-title">{{ event["alt"] }}</h1>

            <div class="gallery-grid" aria-label="Photos from {{ event['alt'] }}">
                {% for photo in photos %}
                <figure class="gallery-card">
                    <button
                        class="gallery-photo-trigger"
                        type="button"
                        data-photo-url="{{ url_for('gallery_uploaded_file', filename=photo['filename']) }}"
                        data-download-name="{{ photo['filename'] }}"
                        data-alt="{{ photo['alt_text'] or event['alt'] }}"
                        data-delete-url="{{ url_for('delete_gallery_image', filename=photo['filename']) }}"
                        aria-label="Expand {{ photo['alt_text'] or photo['filename'] }}"
                    >
                        <img
                            src="{{ url_for('gallery_uploaded_file', filename=photo['filename']) }}"
                            alt="{{ photo['alt_text'] or event['alt'] }}"
                            loading="lazy"
                            decoding="async"
                        >
                    </button>
                </figure>
                {% endfor %}
            </div>
        </section>
    </main>

    <div class="gallery-lightbox" id="galleryLightbox" hidden>
        <div class="gallery-lightbox-panel" role="dialog" aria-modal="true" aria-labelledby="galleryLightboxTitle">
            <button class="gallery-lightbox-close" id="galleryLightboxClose" type="button" aria-label="Close expanded photo">&times;</button>
            <img class="gallery-lightbox-image" id="galleryLightboxImage" src="" alt="">
            <h2 id="galleryLightboxTitle" class="gallery-lightbox-title"></h2>
            <div class="gallery-lightbox-actions">
                <a class="btn" id="galleryLightboxDownload" href="" download>Download Photo</a>
                {% if session.get('admin') %}
                <form id="galleryLightboxDelete" method="POST" onsubmit="return confirm('Are you sure you want to remove this image?');">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button class="btn danger" type="submit">Delete Photo</button>
                </form>
                {% endif %}
            </div>
        </div>
    </div>

    <script>
        const galleryLightbox = document.getElementById('galleryLightbox');
        const galleryLightboxImage = document.getElementById('galleryLightboxImage');
        const galleryLightboxTitle = document.getElementById('galleryLightboxTitle');
        const galleryLightboxDownload = document.getElementById('galleryLightboxDownload');
        const galleryLightboxDelete = document.getElementById('galleryLightboxDelete');

        function closeGalleryLightbox() {
            galleryLightbox.hidden = true;
            document.body.classList.remove('gallery-lightbox-open');
            galleryLightboxImage.src = '';
        }

        document.querySelectorAll('.gallery-photo-trigger').forEach((trigger) => {
            trigger.addEventListener('click', () => {
                const photoUrl = trigger.dataset.photoUrl;
                const altText = trigger.dataset.alt;

                galleryLightboxImage.src = photoUrl;
                galleryLightboxImage.alt = altText;
                galleryLightboxTitle.textContent = altText;
                galleryLightboxDownload.href = photoUrl;
                galleryLightboxDownload.download = trigger.dataset.downloadName;

                if (galleryLightboxDelete) {
                    galleryLightboxDelete.action = trigger.dataset.deleteUrl;
                }

                galleryLightbox.hidden = false;
                document.body.classList.add('gallery-lightbox-open');
            });
        });

        document.getElementById('galleryLightboxClose').addEventListener('click', closeGalleryLightbox);
        galleryLightbox.addEventListener('click', (event) => {
            if (event.target === galleryLightbox) {
                closeGalleryLightbox();
            }
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !galleryLightbox.hidden) {
                closeGalleryLightbox();
            }
        });
    </script>
</body>
</html>
